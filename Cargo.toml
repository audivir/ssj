[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Session survives jumps: a roaming remote shell over QUIC"
license = "MIT"

[workspace.dependencies]
ssj-config = { path = "crates/ssj-config", version = "0.1.0" }
ssj-net = { path = "crates/ssj-net", version = "0.1.0" }
ssj-proto = { path = "crates/ssj-proto", version = "0.1.0" }
ssj-server = { path = "crates/ssj-server", version = "0.1.0" }

[workspace.lints.rust]
# `deny` and not `forbid`, so that the few places that need `unsafe` can allow it with a reason
unsafe_code = "deny"

[profile.release]
debug = false
lto = "fat"
codegen-units = 1
