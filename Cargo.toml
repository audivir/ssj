[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Session survives jumps: a roaming remote shell over QUIC"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
