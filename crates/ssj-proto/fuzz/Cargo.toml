[package]
name = "ssj-proto-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ssj-proto = { path = ".." }

[workspace]

[[bin]]
name = "decode_client"
path = "fuzz_targets/decode_client.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_server"
path = "fuzz_targets/decode_server.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay_model"
path = "fuzz_targets/replay_model.rs"
test = false
doc = false
bench = false
