[package]
name = "ssj-spike"
version.workspace = true
edition.workspace = true
description = "Throwaway M0 spike: pinned mutual TLS and connection survival over QUIC"
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
