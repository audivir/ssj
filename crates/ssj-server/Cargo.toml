[package]
name = "ssj-server"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ssj-proto.workspace = true
ssj-net.workspace = true
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
pty-process = { version = "0.5.3", features = ["async"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-util", "process", "time", "sync", "net", "signal"] }
rustix = { version = "1.1.5", features = ["process", "stdio", "fs"] }
socket2 = { version = "0.6.5", features = ["all"] }
