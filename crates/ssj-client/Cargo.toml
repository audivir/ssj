[package]
name = "ssj-client"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "ssj"
path = "src/main.rs"

[dependencies]
ssj-proto.workspace = true
ssj-net.workspace = true
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustix = { version = "1.1.5", features = ["termios", "stdio"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-util", "io-std", "signal", "time", "sync", "process", "net"] }

[dev-dependencies]
ssj-server.workspace = true
pty-process = "0.5.3"
