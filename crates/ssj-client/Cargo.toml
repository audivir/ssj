[package]
name = "ssj-client"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ssj"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "error-context", "help", "std", "usage"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustix = { version = "1.1.5", features = ["stdio", "termios"] }
sha2 = "0.11.1"
ssj-config.workspace = true
ssj-net.workspace = true
ssj-proto.workspace = true
tokio = { version = "1.53.3", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
pty-process = "0.5.3"
ssj-server.workspace = true
tokio = { version = "1.53.3", features = ["test-util"] }

[build-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-sys = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
system-configuration = "0.8.0"

[features]
default = ["netwatch"]
# Watch the network through the APIs of the system. Without it, only the clock watch runs.
netwatch = []

[lints]
workspace = true
