[package]
name = "ssj-client"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "ssj"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive", "error-context", "help", "std", "usage"] }
confique.workspace = true
dialoguer.workspace = true
hex.workspace = true
quinn.workspace = true
rustix = { workspace = true, features = ["fs", "stdio", "termios"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ssj-config.workspace = true
ssj-net.workspace = true
ssj-proto.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
ureq.workspace = true

[dev-dependencies]
pty-process.workspace = true
ssj-server.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
netlink-sys.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
system-configuration.workspace = true

[features]
default = ["netwatch"]
# Watch the network through the APIs of the system. Without it, only the clock watch runs.
netwatch = []

[lints]
workspace = true
