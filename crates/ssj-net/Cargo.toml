[package]
name = "ssj-net"
version.workspace = true
edition.workspace = true
description = "QUIC transport of ssj: pinned mutual TLS, address validation, and transport limits"
license.workspace = true

[dependencies]
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
sha2 = "0.11.1"
ssj-proto.workspace = true
tokio = { version = "1.53.3", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }

[lints]
workspace = true
