[package]
name = "ssj-net"
version.workspace = true
edition.workspace = true
description = "QUIC transport of ssj: pinned mutual TLS, address validation, and transport limits"
license.workspace = true

[lints]
workspace = true

[dependencies]
ssj-proto.workspace = true
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14.10"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
