name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: j178/prek-action@v3.0.0
  tests:
    name: Test on ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig: false
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            zig: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            zig: true
          - os: macos-latest
            target: aarch64-apple-darwin
            zig: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,zig
      - run: cargo clippy --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
      - name: Install musl-tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --workspace --all-features --target ${{ matrix.target }}
      - name: Check release build with cargo-zigbuild
        if: matrix.zig
        run: cargo zigbuild --release --workspace --target ${{ matrix.target }}
