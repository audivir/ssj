name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
env:
  BIN_NAMES: ssj ssj-server
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that PROTOCOLS.md lists this release with the current protocol
        if: github.event_name == 'release'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          protocol="$(sed -n 's/^pub const PROTOCOL: u16 = \([0-9][0-9]*\);/\1/p' crates/ssj-proto/src/lib.rs)"
          if ! grep -Eq "^\| ${tag_version//./\\.} +\| ${protocol} +\|" PROTOCOLS.md; then
            echo "::error::PROTOCOLS.md has no row for release $tag_version with protocol $protocol"
            exit 1
          fi
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          pkg_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME (version $tag_version) does not match Cargo.toml version ($pkg_version)"
            exit 1
          fi
  build:
    needs: check-version
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zig: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            zig: true
          - os: macos-latest
            target: aarch64-apple-darwin
            zig: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install zig and cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,zig
      - name: Build with cargo-zigbuild
        if: matrix.zig
        run: cargo zigbuild --release --target ${{ matrix.target }}
      - name: Build natively
        if: ${{ !matrix.zig }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package binaries
        run: |
          for bin in $BIN_NAMES; do
            cp "target/${{ matrix.target }}/release/$bin" "$bin-${{ matrix.target }}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ssj-*
          retention-days: 1
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
env:
  BIN_NAMES: ssj ssj-server
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          pkg_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME (version $tag_version) does not match Cargo.toml version ($pkg_version)"
            exit 1
          fi
  build:
    needs: check-version
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install aarch64-linux cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary
        shell: bash
        run: |
          EXT=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then EXT=".exe"; fi
          cp "target/${{ matrix.target }}/release/$BIN_NAME$EXT" "$BIN_NAME-${{ matrix.target }}$EXT"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.BIN_NAME }}-*
          retention-days: 1
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
