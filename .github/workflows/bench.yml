name: Benchmark
# Compares ssh with ssj between two containers, a client and a server, with the link simulated on
# their network interfaces (bench/docker-bench.sh), so that the numbers are those of a host and not
# of a loopback. A clean link and a lossy one. The limits are in bench/check.py and are wide. Start
# it by hand.
on:
  workflow_dispatch:
    inputs:
      netem:
        description: "tc netem arguments for the lossy run"
        default: "delay 40ms loss 1%"
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clean link
        run: |
          mkdir -p results
          NETEM= bench/docker-bench.sh --raw-bulk --bulk-mb 128 --samples 400 --jitter-ms 100 --rounds 2 --json > results/clean.json
      - name: Lossy link
        env:
          NETEM: ${{ inputs.netem }}
        run: |
          BUILD=0 bench/docker-bench.sh --raw-bulk --bulk-mb 16 --samples 100 --jitter-ms 100 --rounds 1 --json > results/lossy.json
      - name: Check the limits
        run: python3 bench/check.py results/clean.json results/lossy.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results
          path: results
