name: Benchmark
# Compares ssh with ssj and the glibc build of the server with the musl build, on a clean machine.
# It prints numbers and gates nothing. Start it by hand.
on:
  workflow_dispatch:
    inputs:
      netem:
        description: "tc netem arguments for the lossy run"
        default: "delay 40ms loss 1%"
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Install zig
        uses: mlugg/setup-zig@v2
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build the client, and the server for glibc and musl
        run: |
          cargo build --release -p ssj-client -p ssj-server
          cargo zigbuild --release -p ssj-server --target x86_64-unknown-linux-musl
      - name: Let ssh log in to this machine
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server
          sudo systemctl start ssh
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          ssh-keyscan localhost >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes localhost true
      - name: Run the benchmark
        run: |
          mkdir -p results
          client=target/release/ssj
          for build in gnu musl; do
            if [ "$build" = gnu ]; then server=target/release/ssj-server; else server=target/x86_64-unknown-linux-musl/release/ssj-server; fi
            python3 bench/bench.py --host localhost --ssj "$client" --server "$server" --json > "results/$build.json"
            python3 bench/bench.py --host localhost --ssj "$client" --server "$server" --netem "${{ inputs.netem }}" --bulk-mb 32 --json > "results/$build-netem.json"
          done
          for f in results/*.json; do echo "== $f"; cat "$f"; done | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: results
